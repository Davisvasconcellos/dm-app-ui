<app-card>
  <div class="flex flex-col h-full rounded-xl transition-all duration-300"
       [ngClass]="{
         'border-l-4 border-l-orange-500 bg-orange-50/50 dark:bg-orange-900/10': status === 'paused',
         'border-l-4 border-l-gray-500 bg-gray-50/50 dark:bg-gray-800/30 opacity-75': status === 'canceled',
         'border-l-4 border-l-transparent': status !== 'paused' && status !== 'canceled'
       }">
    <div class="mb-2 overflow-hidden rounded-lg relative">
      <img
        [src]="image || '/images/cards/card-01.png'"
        alt="card"
        class="overflow-hidden rounded-lg w-full object-cover h-48 cursor-pointer"
        [class.grayscale]="status === 'canceled'"
        (click)="onEditClick()"
      />
      <!-- Status Badge Overlay -->
      <div *ngIf="status === 'paused'" class="absolute top-2 right-2 bg-orange-500 text-white text-xs font-bold px-2 py-1 rounded shadow-lg uppercase tracking-wider">
        Pausado
      </div>
      <div *ngIf="status === 'canceled'" class="absolute top-2 right-2 bg-gray-600 text-white text-xs font-bold px-2 py-1 rounded shadow-lg uppercase tracking-wider">
        Cancelado
      </div>
    </div>
    <div class="flex flex-col flex-grow p-2">
      <app-card-title class="line-clamp-1">{{ eventName }}</app-card-title>
      <app-card-description class="flex-grow line-clamp-1">{{ description }}</app-card-description>
      <div class="mt-4 flex flex-wrap gap-2">
        <app-badge color="success" size="sm">{{ startDate }}</app-badge>
        <app-badge color="info" size="sm">{{ endDate }}</app-badge>
      </div>
        <div class="mt-4 flex flex-wrap gap-2 justify-end">
        <ng-container *ngIf="!isPublic">
          <button (click)="onViewLinksClick()"
                  class="p-2 text-gray-400 hover:text-blue-500 hover:bg-blue-500/10 rounded-lg transition-colors"
                  title="Links">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          </button>

          <button (click)="onEditClick()"
                  class="p-2 text-gray-400 hover:text-yellow-500 hover:bg-yellow-500/10 rounded-lg transition-colors"
                  title="Editar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
            </svg>
          </button>
          
          <button (click)="onPauseClick()"
                  class="p-2 rounded-lg transition-colors"
                  [ngClass]="status === 'paused' ? 'text-green-500 hover:text-green-600 hover:bg-green-500/10' : 'text-gray-400 hover:text-orange-500 hover:bg-orange-500/10'"
                  [title]="status === 'paused' ? 'Retomar Evento' : 'Pausar Evento'">
            <svg *ngIf="status !== 'paused'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="10" y1="15" x2="10" y2="9"></line>
              <line x1="14" y1="15" x2="14" y2="9"></line>
            </svg>
            <svg *ngIf="status === 'paused'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </button>
          
          <button (click)="onCancelClick()"
                  class="p-2 rounded-lg transition-colors"
                  [ngClass]="status === 'canceled' ? 'text-green-500 hover:text-green-600 hover:bg-green-500/10' : 'text-gray-400 hover:text-gray-500 hover:bg-gray-500/10'"
                  [title]="status === 'canceled' ? 'Reativar Evento' : 'Cancelar Evento'">
            <svg *ngIf="status !== 'canceled'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
            <svg *ngIf="status === 'canceled'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
          </button>
          
          <button (click)="onDeleteClick()"
                  class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-500/10 rounded-lg transition-colors"
                  title="Excluir Evento">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </ng-container>
        <ng-container *ngIf="isPublic">
          <button (click)="onActionClick()"
                  class="inline-flex items-center gap-2 px-4 py-3 text-sm font-medium rounded-lg shadow-theme-xs bg-brand-500 text-white hover:bg-brand-600">
            {{ actionLabel }}
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</app-card>
