<div class="space-y-6">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <div class="text-lg font-semibold text-gray-900 dark:text-white">Trabalho</div>
      <div class="text-xs text-gray-500 dark:text-gray-400">
        @if (project) { {{ project.name }} } @else { Selecione um projeto }
      </div>
    </div>

    <a
      routerLink="/project"
      class="rounded-lg border border-gray-200 bg-white px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-800 dark:bg-gray-900/40 dark:text-gray-200 dark:hover:bg-white/5"
    >
      Trocar projeto
    </a>
  </div>

  @if (project) {
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
      <div class="lg:col-span-2 space-y-4">
        <div class="rounded-xl border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900/40">
          <div class="text-sm font-semibold text-gray-900 dark:text-white">Tarefas</div>
          <div class="mt-1 text-sm text-gray-500 dark:text-gray-400">
            Em breve: lista de tarefas do projeto.
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <div class="rounded-xl border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900/40">
          <div class="text-sm font-semibold text-gray-900 dark:text-white">Anotação rápida</div>
          <textarea
            class="mt-2 w-full rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-900 outline-none focus:border-brand-500 dark:border-gray-800 dark:bg-gray-900/40 dark:text-white"
            rows="4"
            placeholder="O que você vai fazer agora?"
            [(ngModel)]="note"
          ></textarea>
        </div>

        <div class="rounded-xl border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900/40">
          <div class="text-sm font-semibold text-gray-900 dark:text-white">Timer</div>
          <div class="mt-1 text-sm text-gray-500 dark:text-gray-400">
            Em breve: iniciar/parar com Electron (time-entries).
          </div>
          <button class="mt-3 w-full rounded-lg bg-brand-500 px-4 py-3 text-sm font-medium text-white opacity-60" disabled>
            Iniciar
          </button>
        </div>
      </div>
    </div>
  }
</div>
